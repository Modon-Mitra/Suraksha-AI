plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// Load API keys from local.properties (never commit these to Git)
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}

android {
    namespace "com.suraksha.ai"
    compileSdk 34

    // Prevent TFLite model from being compressed inside the APK
    // (required — compression breaks memory-mapped model loading)
    aaptOptions {
        noCompress "tflite"
    }

    configurations.all {
        resolutionStrategy {
            force "com.google.guava:guava:32.1.3-android"
        }
    }

    defaultConfig {
        applicationId "com.suraksha.ai"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField 'String', 'CLAUDE_API_KEY',
                '"' + (localProps['CLAUDE_API_KEY'] ?: '') + '"'
        buildConfigField 'String', 'PLACES_API_KEY',
                '"' + (localProps['GOOGLE_PLACES_API_KEY'] ?: '') + '"'

        // Supabase — used only by EvidenceCollectionAgent (replaces Firebase Storage)
        buildConfigField 'String', 'SUPABASE_ANON_KEY',
                '"' + (localProps['SUPABASE_ANON_KEY'] ?: '') + '"'

        // Groq — used by EmotionalSupportAgent and CyberHarassmentAgent (100% free)
        buildConfigField 'String', 'GROQ_API_KEY',
                '"' + (localProps['GROQ_API_KEY'] ?: '') + '"'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
    }
}

dependencies {

    // AndroidX Core
    implementation "com.google.guava:guava:32.1.3-android"
    implementation "androidx.concurrent:concurrent-futures:1.1.0"
    implementation "androidx.work:work-runtime-ktx:2.9.0"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment:2.7.6'
    implementation 'androidx.navigation:navigation-ui:2.7.6'

    // Location & Maps
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'

    // Lottie animations
    implementation 'com.airbnb.android:lottie:6.3.0'

    // Circular progress
    implementation 'com.mikhaellopez:circularprogressbar:3.1.0'

    // Firebase
    implementation 'com.google.firebase:firebase-firestore:25.1.0'
    implementation 'com.google.firebase:firebase-auth:23.0.0'
    implementation 'com.google.firebase:firebase-storage:21.0.0'

    // Encrypted SharedPreferences (voice auth)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // TensorFlow Lite (voice print model)
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
}